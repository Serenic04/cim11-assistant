name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-api/requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 data-api/app --max-line-length=120 --extend-ignore=E203

      - name: Run tests (echantillon reduit, execution rapide)
        run: pytest tests/ -v
