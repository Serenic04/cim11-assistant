<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1F3864"/>
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7f7f7f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F3864">Architecture applicative — cim11-assistant</text>

  <!-- Utilisateur -->
  <rect x="410" y="60" width="180" height="46" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="500" y="88" text-anchor="middle" font-size="15" fill="#333333">Utilisateur (agent DIM)</text>
  <line x1="500" y1="106" x2="500" y2="140" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- app_streamlit -->
  <rect x="360" y="142" width="280" height="66" rx="8" fill="#1F3864"/>
  <text x="500" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">app_streamlit</text>
  <text x="500" y="188" text-anchor="middle" font-size="12" fill="#dbe2f0">UI d'aide au codage + dashboard monitorage (E4/E5)</text>

  <!-- Lines down to two APIs -->
  <line x1="440" y1="208" x2="240" y2="252" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="208" x2="760" y2="252" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- data_api -->
  <rect x="90" y="254" width="300" height="80" rx="8" fill="#2E5395" stroke="#1F3864" stroke-width="1.5"/>
  <text x="240" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">data_api (FastAPI)</text>
  <text x="240" y="300" text-anchor="middle" font-size="12" fill="#dbe2f0">6 endpoints REST — referentiel CIM-11</text>
  <text x="240" y="318" text-anchor="middle" font-size="12" fill="#dbe2f0">Auth par cle API — GET /health</text>

  <!-- model_api -->
  <rect x="610" y="254" width="300" height="80" rx="8" fill="#2E5395" stroke="#1F3864" stroke-width="1.5"/>
  <text x="760" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">model_api (FastAPI)</text>
  <text x="760" y="300" text-anchor="middle" font-size="12" fill="#dbe2f0">POST /predict — GET /metrics (C11/C20)</text>
  <text x="760" y="318" text-anchor="middle" font-size="12" fill="#dbe2f0">Auth par cle API — GET /health</text>

  <!-- down to storage -->
  <line x1="240" y1="334" x2="240" y2="378" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="334" x2="760" y2="378" stroke="#1F3864" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PostgreSQL -->
  <rect x="90" y="380" width="300" height="64" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="240" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">PostgreSQL</text>
  <text x="240" y="424" text-anchor="middle" font-size="12" fill="#595959">Modele Merise — 34 663 codes CIM-11</text>

  <!-- Model + adapter -->
  <rect x="610" y="380" width="300" height="64" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="1.5"/>
  <text x="760" y="402" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Llama-3-8B-Instruct + adapter LoRA</text>
  <text x="760" y="420" text-anchor="middle" font-size="12" fill="#595959">Quantification 4 bits — fine-tune CIM-11</text>
  <text x="760" y="436" text-anchor="middle" font-size="12" fill="#595959">(entrainement realise sur Google Colab)</text>

  <!-- CI/CD pipeline box -->
  <rect x="90" y="510" width="820" height="150" rx="10" fill="#ffffff" stroke="#7f7f7f" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="120" y="534" font-size="14" font-weight="bold" fill="#595959">Chaine d'integration et de livraison continue (C13/C18/C19)</text>

  <rect x="115" y="552" width="150" height="56" rx="6" fill="#F2F2F2" stroke="#7f7f7f" stroke-width="1.2"/>
  <text x="190" y="576" text-anchor="middle" font-size="12.5" fill="#333333">git push</text>
  <text x="190" y="594" text-anchor="middle" font-size="11" fill="#7f7f7f">branche main</text>

  <line x1="265" y1="580" x2="330" y2="580" stroke="#7f7f7f" stroke-width="2" marker-end="url(#arrowGrey)"/>

  <rect x="332" y="552" width="180" height="56" rx="6" fill="#F2F2F2" stroke="#7f7f7f" stroke-width="1.2"/>
  <text x="422" y="574" text-anchor="middle" font-size="12.5" fill="#333333">GitHub Actions</text>
  <text x="422" y="592" text-anchor="middle" font-size="11" fill="#7f7f7f">lint flake8 + pytest</text>

  <line x1="514" y1="580" x2="579" y2="580" stroke="#7f7f7f" stroke-width="2" marker-end="url(#arrowGrey)"/>

  <rect x="581" y="552" width="180" height="56" rx="6" fill="#F2F2F2" stroke="#7f7f7f" stroke-width="1.2"/>
  <text x="671" y="574" text-anchor="middle" font-size="12.5" fill="#333333">Build images Docker</text>
  <text x="671" y="592" text-anchor="middle" font-size="11" fill="#7f7f7f">data_api + model_api</text>

  <line x1="763" y1="580" x2="768" y2="580" stroke="#7f7f7f" stroke-width="2" marker-end="url(#arrowGrey)"/>

  <rect x="770" y="552" width="130" height="56" rx="6" fill="#F2F2F2" stroke="#7f7f7f" stroke-width="1.2"/>
  <text x="835" y="574" text-anchor="middle" font-size="12.5" fill="#333333">ghcr.io</text>
  <text x="835" y="592" text-anchor="middle" font-size="11" fill="#7f7f7f">images taguees</text>

  <text x="120" y="644" font-size="11" fill="#7f7f7f">Se declenche sur push vers main, apres validation des tests (needs: lint-and-test).</text>

  <!-- Legend -->
  <rect x="820" y="60" width="14" height="14" fill="#1F3864"/>
  <text x="840" y="72" font-size="11" fill="#595959">Flux applicatif</text>
  <rect x="820" y="82" width="14" height="14" fill="#7f7f7f"/>
  <text x="840" y="94" font-size="11" fill="#595959">Flux CI/CD</text>
</svg>
